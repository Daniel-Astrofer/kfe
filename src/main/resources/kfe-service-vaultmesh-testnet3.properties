# Vault Mesh Lab P0 visualization profile. This is not a production go-live profile.
# Import with:
#   --spring.config.additional-location=classpath:kfe-service-vaultmesh-testnet3.properties

bitcoin.network=testnet3
kfe.vaultmesh.enabled=${KFE_VAULTMESH_ENABLED:true}
kfe.vaultmesh.mesh-only=${KFE_VAULTMESH_MESH_ONLY:false}
kfe.vaultmesh.submit-on-outbound=${KFE_VAULTMESH_SUBMIT_ON_OUTBOUND:true}
kfe.vaultmesh.base-url=${KFE_VAULTMESH_BASE_URL:http://127.0.0.1:7701}
kfe.vaultmesh.connect-timeout-ms=${KFE_VAULTMESH_CONNECT_TIMEOUT_MS:2000}
kfe.vaultmesh.read-timeout-ms=${KFE_VAULTMESH_READ_TIMEOUT_MS:5000}
# Insecure lab-only default. Override it together with VAULT_API_TOKEN.
kfe.vaultmesh.api-token=${KFE_VAULTMESH_API_TOKEN:kerosene-vault-lab-only}
