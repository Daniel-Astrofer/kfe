# Production hardening defaults for KFE financial rails.
# Import via SPRING_CONFIG_IMPORT or copy keys into the prod ConfigMap.
# Do NOT enable until RUNBOOK_KFE_LIGHTNING_E2E_TESTNET.md is green.

# Fail-closed Lightning risk flags (liquidity / jamming soft-paths become hard).
kfe.settlement.lightning.risk-gate-mode=enforce
kfe.settlement.allow-simulated-balances=false
kfe.settlement.por-gate-enabled=true

# Anti-jamming: refuse when HTLC probe unavailable.
kfe.lightning.jamming.enforce-when-unprobeable=true
kfe.lightning.max-pending-htlcs=48

# Full blocks from now (infra BITCOIN_PRUNE_MB=0).
# Channel ops require anchors + MPC.
kfe.channel.anchors-required=true
kfe.channel.require-mpc=true

# Loop fallback only if loopd is deployed and LIGHTNING_LOOP_ENABLED=true.
kfe.channel.rebalance-worker.loop-fallback-enabled=true
