# F8 staging / go-live profile: mesh-only settlement, mpc signing off (clean cut).
# Vault mesh may be domestic-native (software attestation) and/or SEV-preferred nodes;
# this profile does NOT hard-require tee_hw / all-SEV.
# This profile does not select a Bitcoin network. Mesh Lab P0 imports the dedicated
# testnet3 profile; production keeps the global mainnet default unless explicitly set.
# Activate via: spring.config.import or SPRING_CONFIG_ADDITIONAL_LOCATION /
#   --spring.config.additional-location=classpath:kfe-service-vaultmesh-go-live.properties
#
# mTLS (staging / Production Gate visualize):
#   ./backend/kerosene-vault/scripts/gen_lab_mtls_certs.sh
#   optional rotate: VAULT_LAB_MTLS_TTL_HOURS=24 ./backend/kerosene-vault/scripts/rotate_lab_mtls_certs.sh
#   layout: backend/kerosene-vault/docs/MTLS_SPIFFE_LAYOUT.md

# Mesh required — no dual-run with mpc for treasury signing.
kfe.vaultmesh.enabled=${KFE_VAULTMESH_ENABLED:true}
kfe.vaultmesh.mesh-only=${KFE_VAULTMESH_MESH_ONLY:true}
kfe.vaultmesh.submit-on-outbound=${KFE_VAULTMESH_SUBMIT_ON_OUTBOUND:true}
# HTTPS when vaults listen with VAULT_AUTH_MODE=mtls (staging compose ports 7801–7803).
kfe.vaultmesh.base-url=${KFE_VAULTMESH_BASE_URL:https://127.0.0.1:7801}
# Empty under mTLS — MutualTlsAuthAdapter refuses X-Vault-Token.
kfe.vaultmesh.api-token=${KFE_VAULTMESH_API_TOKEN:}
# Go-live guard: refuse static_token; require client cert materials (see KfeVaultMeshGoLiveGuard).
# Vault binary separately refuses ATTESTATION_MODE=sim + clearnet under staging/production;
# production ceremony requires VAULT_TRANSPORT=tor + mTLS (see CEREMONY_TOR.md / CEREMONY_NATIVE.md).
kfe.vaultmesh.require-mtls=${KFE_VAULTMESH_REQUIRE_MTLS:true}

# Client TLS materials (flat lab-certs paths or PKCS12). Set paths after gen_lab_mtls_certs.sh.
kfe.vaultmesh.tls.enabled=${KFE_VAULTMESH_TLS_ENABLED:true}
kfe.vaultmesh.tls.cert-path=${KFE_VAULTMESH_TLS_CERT_PATH:}
kfe.vaultmesh.tls.key-path=${KFE_VAULTMESH_TLS_KEY_PATH:}
kfe.vaultmesh.tls.ca-path=${KFE_VAULTMESH_TLS_CA_PATH:}
kfe.vaultmesh.tls.keystore-path=${KFE_VAULTMESH_TLS_KEYSTORE_PATH:}
kfe.vaultmesh.tls.keystore-password=${KFE_VAULTMESH_TLS_KEYSTORE_PASSWORD:changeit}
kfe.vaultmesh.tls.truststore-path=${KFE_VAULTMESH_TLS_TRUSTSTORE_PATH:}
kfe.vaultmesh.tls.truststore-password=${KFE_VAULTMESH_TLS_TRUSTSTORE_PASSWORD:changeit}
kfe.vaultmesh.tls.hostname-verification=${KFE_VAULTMESH_TLS_HOSTNAME_VERIFICATION:true}

# KFE requests daily day-advance + reshare; vaults execute (mesh-only path).
kfe.vaultmesh.day-rotation.enabled=${KFE_VAULTMESH_DAY_ROTATION_ENABLED:true}
kfe.vaultmesh.day-rotation.cron=${KFE_VAULTMESH_DAY_ROTATION_CRON:0 5 0 * * *}
kfe.vaultmesh.day-rotation.fixed-delay-ms=${KFE_VAULTMESH_DAY_ROTATION_FIXED_DELAY_MS:3600000}
kfe.vaultmesh.day-rotation.initial-delay-ms=${KFE_VAULTMESH_DAY_ROTATION_INITIAL_DELAY_MS:120000}
kfe.vaultmesh.day-rotation.voter-id=${KFE_VAULTMESH_DAY_ROTATION_VOTER_ID:kfe}
kfe.vaultmesh.day-rotation.trigger-reshare=${KFE_VAULTMESH_DAY_ROTATION_TRIGGER_RESHARE:true}
kfe.vaultmesh.day-rotation.reshare-reason=${KFE_VAULTMESH_DAY_ROTATION_RESHARE_REASON:kfe-day-rotation}

# Legacy mpc signing path must stay off at go-live (no silent rollback).
kfe.mpc.signing-enabled=${KFE_MPC_SIGNING_ENABLED:false}
kfe.standalone.mpc.dev-keygen-enabled=false
