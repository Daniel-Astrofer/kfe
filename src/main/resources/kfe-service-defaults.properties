kfe.standalone=true
spring.application.name=kfe-service
# When true (default), standalone KFE relays user STOMP frames to Core via HTTP.
kfe.remote.stomp-relay.enabled=true

# Vault mesh Intent/Receipt bridge (F4).
# FAIL-CLOSED DEFAULT: vault mesh enabled + mesh-only + mTLS required.
# Reason: production must not silently fall back to insecure path if config is missing.
# Override with local-dev-mode=true (lab/test only) to use legacy insecure defaults.
kfe.vaultmesh.enabled=${KFE_VAULTMESH_ENABLED:true}
kfe.vaultmesh.base-url=${KFE_VAULTMESH_BASE_URL:https://127.0.0.1:7801}
# Comma-separated vault URLs for multi-vault consultation (critical reads query >= threshold vaults)
kfe.vaultmesh.urls=${KFE_VAULTMESH_URLS:${kfe.vaultmesh.base-url:https://127.0.0.1:7801}}
kfe.vaultmesh.connect-timeout-ms=${KFE_VAULTMESH_CONNECT_TIMEOUT_MS:2000}
kfe.vaultmesh.read-timeout-ms=${KFE_VAULTMESH_READ_TIMEOUT_MS:5000}
# FAIL-CLOSED: api-token must be empty; production uses mTLS. Lab overridden by local-dev-mode.
kfe.vaultmesh.api-token=${KFE_VAULTMESH_API_TOKEN:}
kfe.vaultmesh.submit-on-outbound=${KFE_VAULTMESH_SUBMIT_ON_OUTBOUND:true}
kfe.vaultmesh.default-bucket=${KFE_VAULTMESH_DEFAULT_BUCKET:USERS}
# mTLS client cert to vault mesh (PEM or PKCS12). REQUIRED in production.
kfe.vaultmesh.tls.enabled=${KFE_VAULTMESH_TLS_ENABLED:true}
kfe.vaultmesh.tls.cert-path=${KFE_VAULTMESH_TLS_CERT_PATH:}
kfe.vaultmesh.tls.key-path=${KFE_VAULTMESH_TLS_KEY_PATH:}
kfe.vaultmesh.tls.ca-path=${KFE_VAULTMESH_TLS_CA_PATH:}
kfe.vaultmesh.tls.keystore-path=${KFE_VAULTMESH_TLS_KEYSTORE_PATH:}
kfe.vaultmesh.tls.keystore-password=${KFE_VAULTMESH_TLS_KEYSTORE_PASSWORD:}
kfe.vaultmesh.tls.keystore-type=${KFE_VAULTMESH_TLS_KEYSTORE_TYPE:PKCS12}
kfe.vaultmesh.tls.truststore-path=${KFE_VAULTMESH_TLS_TRUSTSTORE_PATH:}
kfe.vaultmesh.tls.truststore-password=${KFE_VAULTMESH_TLS_TRUSTSTORE_PASSWORD:}
kfe.vaultmesh.tls.truststore-type=${KFE_VAULTMESH_TLS_TRUSTSTORE_TYPE:PKCS12}
# FAIL-CLOSED: hostname verification must be on.
kfe.vaultmesh.tls.hostname-verification=${KFE_VAULTMESH_TLS_HOSTNAME_VERIFICATION:true}
# FAIL-CLOSED: mesh-only = true. Vault mesh is the ONLY signing path. No dual-run mpc.
kfe.vaultmesh.mesh-only=${KFE_VAULTMESH_MESH_ONLY:true}
# FAIL-CLOSED: require client mTLS. Refuses kfe.vaultmesh.api-token (lab static_token).
kfe.vaultmesh.require-mtls=${KFE_VAULTMESH_REQUIRE_MTLS:true}
# Legacy mpc signing DISABLED — mesh-only path. No dual-run mpc.
kfe.mpc.signing-enabled=${KFE_MPC_SIGNING_ENABLED:false}
# LOCAL DEV OVERRIDE: set true to revert to insecure defaults (lab/testnet3 only).
# WARNING: this disables mTLS, enables static_token, disables mesh-only, disables PoR gate.
kfe.vaultmesh.local-dev-mode=${KFE_VAULTMESH_LOCAL_DEV_MODE:false}
# F9 survivability: bank ledger/USERS must not depend on a single vault; no unilateral kill-switch.
# Mesh fail-closed for signing when online < t; kfe remains available for balances/product.
kfe.vaultmesh.survivability.refuse-unilateral-kill=${KFE_VAULTMESH_REFUSE_UNILATERAL_KILL:true}
kfe.vaultmesh.survivability.bank-independent-of-vault-shard=${KFE_VAULTMESH_BANK_INDEPENDENT:true}
# KFE requests daily day-advance + reshare; vaults execute (no vault self-cron). Off unless vaultmesh on.
kfe.vaultmesh.day-rotation.enabled=${KFE_VAULTMESH_DAY_ROTATION_ENABLED:false}
kfe.vaultmesh.day-rotation.cron=${KFE_VAULTMESH_DAY_ROTATION_CRON:-}
kfe.vaultmesh.day-rotation.fixed-delay-ms=${KFE_VAULTMESH_DAY_ROTATION_FIXED_DELAY_MS:900000}
kfe.vaultmesh.day-rotation.initial-delay-ms=${KFE_VAULTMESH_DAY_ROTATION_INITIAL_DELAY_MS:60000}
kfe.vaultmesh.day-rotation.voter-id=${KFE_VAULTMESH_DAY_ROTATION_VOTER_ID:kfe}
kfe.vaultmesh.day-rotation.trigger-reshare=${KFE_VAULTMESH_DAY_ROTATION_TRIGGER_RESHARE:true}
kfe.vaultmesh.day-rotation.reshare-reason=${KFE_VAULTMESH_DAY_ROTATION_RESHARE_REASON:kfe-day-rotation}

# Vault mesh constitution (fixed threshold enforcement, not relative unanimity)
kfe.vaultmesh.constitution.member-count=${KFE_VAULTMESH_CONSTITUTION_MEMBER_COUNT:3}
kfe.vaultmesh.constitution.threshold=${KFE_VAULTMESH_CONSTITUTION_THRESHOLD:2}
kfe.vaultmesh.constitution.hash=${VAULT_MESH_CONSTITUTION_HASH:}

server.address=0.0.0.0
server.port=${SERVER_PORT:8080}
server.shutdown=${SERVER_SHUTDOWN:graceful}
spring.lifecycle.timeout-per-shutdown-phase=${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:45s}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kerosene}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:api_system}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
# Local/full runs many scheduled jobs (pool 8) + request; default Hikari 10 is too tight when any
# job holds a connection across chain RPC. Kill runaway idle-in-transaction sessions at 60s.
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:24}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:4}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:10000}
spring.datasource.hikari.leak-detection-threshold=${SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD:30000}
spring.datasource.hikari.connection-init-sql=SET idle_in_transaction_session_timeout TO '60s'
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# API timestamps always UTC Instant (ISO-8601 with Z); clients convert to local TZ.
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.validate-on-migrate=true

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2000}
spring.data.redis.connect-timeout=${SPRING_DATA_REDIS_CONNECT_TIMEOUT:2s}

# Local/dev fallback only — production must set JWT_SECRET via environment variable.
# The default is intentionally empty; KfeProductionGateConfig refuses boot on production mode with missing secret.
api.secret.token.secret=${JWT_SECRET:}
kfe.internal.shared-secret=${KFE_INTERNAL_SHARED_SECRET:}
# Optional dedicated AES-256 key (base64 of 32 bytes). If empty, SHA-256(kfe.internal.shared-secret) with gate.
kfe.column-crypto.key-base64=${KFE_COLUMN_CRYPTO_KEY_BASE64:}
# Rotation key for key versioning. Decrypt tries v1 then v2; encrypt uses v2 when set.
kfe.column-crypto.key-base64-v2=${KFE_COLUMN_CRYPTO_KEY_BASE64_V2:}
# Allow deriving AES key from KFE_INTERNAL_SHARED_SECRET when no dedicated key is provided.
# Set to true in lab/dev only; production must use a dedicated KFE_COLUMN_CRYPTO_KEY_BASE64.
kfe.crypto.allow-shared-secret-derivation=${KFE_CRYPTO_ALLOW_SHARED_SECRET_DERIVATION:false}
kfe.security.jwt.revocation-check-enabled=${KFE_JWT_REVOCATION_CHECK_ENABLED:true}
# JWT claim hardening
kfe.auth.production-mode=${KFE_AUTH_PRODUCTION_MODE:false}
kfe.auth.jwt.issuer=${KFE_AUTH_JWT_ISSUER:Kerosene-KFE}
kfe.auth.jwt.audience=${KFE_AUTH_JWT_AUDIENCE:kerosene-app}
kfe.auth.revocation.required=${KFE_AUTH_REVOCATION_REQUIRED:false}

bitcoin.network=${BITCOIN_NETWORK:mainnet}
bitcoin.rpc.enabled=${BITCOIN_RPC_ENABLED:false}
bitcoin.rpc.required=${BITCOIN_RPC_REQUIRED:false}
bitcoin.rpc.pruned-required=${BITCOIN_RPC_PRUNED_REQUIRED:false}
bitcoin.rpc.url=${BITCOIN_RPC_URL:}
bitcoin.rpc.username=${BITCOIN_RPC_USER:}
bitcoin.rpc.password=${BITCOIN_RPC_PASSWORD:}
bitcoin.rpc.wallet=${BITCOIN_RPC_WALLET:kerosene}
kfe.bitcoin.validate-network-enabled=${KFE_BITCOIN_VALIDATE_NETWORK_ENABLED:true}
kfe.bitcoin.require-synced-enabled=${KFE_BITCOIN_REQUIRE_SYNCED_ENABLED:false}
kfe.bitcoin-core.wallets.bootstrap-enabled=${KFE_BITCOIN_CORE_WALLETS_BOOTSTRAP_ENABLED:true}
kfe.bitcoin-core.wallets.funds=${KFE_BITCOIN_CORE_FUNDS_WALLET:kerosene-funds}
kfe.bitcoin-core.wallets.profit=${KFE_BITCOIN_CORE_PROFIT_WALLET:kerosene-profit}
kfe.system.user-id=${KFE_SYSTEM_USER_ID:0}
kfe.system.wallets.funds-label=${KFE_SYSTEM_FUNDS_WALLET_LABEL:Kerosene Fundos Globais}
kfe.system.wallets.profit-label=${KFE_SYSTEM_PROFIT_WALLET_LABEL:Kerosene Lucro}
bitcoin.platform.master-xpub=${BITCOIN_PLATFORM_MASTER_XPUB:}
bitcoin.hot-wallet.xpub=${BITCOIN_HOT_WALLET_XPUB:}
bitcoin.min-confirmations=${BITCOIN_MIN_CONFIRMATIONS:3}
# Finality policy: granular confirmation tiers for deposit lifecycle.
# detected = 0-conf mempool visibility (transaction seen but not in block)
bitcoin.detected-confirmations=${BITCOIN_DETECTED_CONFIRMATIONS:0}
# credit = funds become available to the user (available_sats credited)
bitcoin.credit-confirmations=${BITCOIN_CREDIT_CONFIRMATIONS:3}
# finality = monitor ceases; funds considered irreversible (production: >= 3)
bitcoin.finality-confirmations=${BITCOIN_FINALITY_CONFIRMATIONS:6}
# reorg-monitor = extended watch window for reorg detection beyond finality
bitcoin.reorg-monitor-confirmations=${BITCOIN_REORG_MONITOR_CONFIRMATIONS:12}

transactions.bitcoin-core-wallet-address-enabled=${TRANSACTIONS_BITCOIN_CORE_WALLET_ADDRESS_ENABLED:true}
kfe.receive.bitcoin-core-wallet-address-enabled=${KFE_RECEIVE_BITCOIN_CORE_WALLET_ADDRESS_ENABLED:${transactions.bitcoin-core-wallet-address-enabled:true}}

kfe.network-monitor.enabled=${KFE_NETWORK_MONITOR_ENABLED:false}
kfe.network-monitor.fixed-delay-ms=${KFE_NETWORK_MONITOR_FIXED_DELAY_MS:30000}
kfe.network-monitor.initial-delay-ms=${KFE_NETWORK_MONITOR_INITIAL_DELAY_MS:20000}
kfe.network-monitor.batch-size=${KFE_NETWORK_MONITOR_BATCH_SIZE:50}
kfe.network-monitor.onchain.min-confirmations=${KFE_NETWORK_MONITOR_ONCHAIN_MIN_CONFIRMATIONS:${bitcoin.min-confirmations:3}}
# observed_sats from blockchain for WATCH_ONLY + CUSTODIAL_ONCHAIN (never invents cold internal balance)
kfe.onchain-balance-sync.enabled=${KFE_ONCHAIN_BALANCE_SYNC_ENABLED:true}
kfe.onchain-balance-sync.fixed-delay-ms=${KFE_ONCHAIN_BALANCE_SYNC_FIXED_DELAY_MS:1000}
kfe.onchain-balance-sync.initial-delay-ms=${KFE_ONCHAIN_BALANCE_SYNC_INITIAL_DELAY_MS:40000}
kfe.onchain-balance-sync.batch-size=${KFE_ONCHAIN_BALANCE_SYNC_BATCH_SIZE:50}
# Shared descriptor gap for cold observe + onchain sync + listUtxos (receive+change)
kfe.descriptor-scan-range=${KFE_DESCRIPTOR_SCAN_RANGE:200}
kfe.onchain-balance-sync.descriptor-range=${KFE_ONCHAIN_BALANCE_SYNC_DESCRIPTOR_RANGE:${kfe.descriptor-scan-range:200}}
# Fresh LIVE collect is protected from ZMQ OPTIMISTIC_DELTA for this many seconds
kfe.onchain-balance-sync.optimistic-live-ttl-seconds=${KFE_ONCHAIN_BALANCE_SYNC_OPTIMISTIC_LIVE_TTL_SECONDS:120}
# External deposits to custodial receive addresses (Electrum → custodial, not only payment requests)
kfe.custodial-deposit-observation.enabled=${KFE_CUSTODIAL_DEPOSIT_OBSERVATION_ENABLED:true}
kfe.custodial-deposit-observation.fixed-delay-ms=${KFE_CUSTODIAL_DEPOSIT_OBSERVATION_FIXED_DELAY_MS:1000}
kfe.custodial-deposit-observation.initial-delay-ms=${KFE_CUSTODIAL_DEPOSIT_OBSERVATION_INITIAL_DELAY_MS:12000}
kfe.custodial-deposit-observation.batch-size=${KFE_CUSTODIAL_DEPOSIT_OBSERVATION_BATCH_SIZE:30}
# Confirmations required to credit available_sats. Inbound rows are created at 0-conf
# (VALIDATING) so the recipient app can show the receive immediately; set 0 for
# local/testnet mempool credit, 3+ for production safety.
kfe.custodial-deposit-observation.min-confirmations=${KFE_CUSTODIAL_DEPOSIT_OBSERVATION_MIN_CONFIRMATIONS:${bitcoin.min-confirmations:3}}

# Cold history forward monitoring (UTXO scan → transactions_master)
kfe.cold-observation.enabled=${KFE_COLD_OBSERVATION_ENABLED:true}
kfe.cold-observation.fixed-delay-ms=${KFE_COLD_OBSERVATION_FIXED_DELAY_MS:30000}
kfe.cold-observation.initial-delay-ms=${KFE_COLD_OBSERVATION_INITIAL_DELAY_MS:50000}
kfe.cold-observation.batch-size=${KFE_COLD_OBSERVATION_BATCH_SIZE:20}
kfe.cold-observation.descriptor-range=${KFE_COLD_OBSERVATION_DESCRIPTOR_RANGE:${kfe.descriptor-scan-range:200}}
# Dual-ledger / cold freshness reconciliation (logs + metrics; no auto-unlock)
kfe.balance-reconciliation.enabled=${KFE_BALANCE_RECONCILIATION_ENABLED:true}
kfe.balance-reconciliation.fixed-delay-ms=${KFE_BALANCE_RECONCILIATION_FIXED_DELAY_MS:180000}
kfe.balance-reconciliation.initial-delay-ms=${KFE_BALANCE_RECONCILIATION_INITIAL_DELAY_MS:90000}
kfe.balance-reconciliation.drift-threshold-sats=${KFE_BALANCE_RECONCILIATION_DRIFT_THRESHOLD_SATS:1000}
kfe.balance-reconciliation.locked-stuck-minutes=${KFE_BALANCE_RECONCILIATION_LOCKED_STUCK_MINUTES:30}
kfe.balance-reconciliation.cold-batch-size=${KFE_BALANCE_RECONCILIATION_COLD_BATCH_SIZE:20}

# ZMQ accelerator: hashblock/rawtx → debounced observe/sync (poll remains safety net)
kfe.bitcoin.zmq.enabled=${BITCOIN_ZMQ_ENABLED:false}
kfe.bitcoin.zmq.hashblock=${BITCOIN_ZMQ_HASHBLOCK:}
kfe.bitcoin.zmq.rawtx=${BITCOIN_ZMQ_RAWTX:}
kfe.bitcoin.zmq.subscribe-rawtx=${KFE_BITCOIN_ZMQ_SUBSCRIBE_RAWTX:true}
kfe.bitcoin.zmq.debounce-ms=${KFE_BITCOIN_ZMQ_DEBOUNCE_MS:400}
kfe.bitcoin.zmq.address-cache-refresh-ms=${KFE_BITCOIN_ZMQ_ADDRESS_CACHE_REFRESH_MS:30000}
# Align with descriptor-scan-range so ZMQ sees the same receive/change window as cold observe
kfe.bitcoin.zmq.address-gap-external=${KFE_BITCOIN_ZMQ_ADDRESS_GAP_EXTERNAL:${kfe.descriptor-scan-range:200}}
kfe.bitcoin.zmq.address-gap-change=${KFE_BITCOIN_ZMQ_ADDRESS_GAP_CHANGE:${kfe.descriptor-scan-range:200}}
kfe.payment-request-monitor.enabled=${KFE_PAYMENT_REQUEST_MONITOR_ENABLED:true}
kfe.payment-request-monitor.fixed-delay-ms=${KFE_PAYMENT_REQUEST_MONITOR_FIXED_DELAY_MS:1000}
kfe.payment-request-monitor.initial-delay-ms=${KFE_PAYMENT_REQUEST_MONITOR_INITIAL_DELAY_MS:20000}
kfe.payment-request-monitor.batch-size=${KFE_PAYMENT_REQUEST_MONITOR_BATCH_SIZE:50}
kfe.payment-request-monitor.onchain.min-confirmations=${KFE_PAYMENT_REQUEST_MONITOR_ONCHAIN_MIN_CONFIRMATIONS:${bitcoin.min-confirmations:3}}
kfe.execution.enabled=${KFE_EXECUTION_ENABLED:true}
# Pay Lightning invoices in the submit request path (claim+process outbox after commit)
# so the API returns SETTLED/FAILED instead of leaving the app on EXECUTING forever.
# Async outbox worker remains the safety net. Disable with false for pure async.
kfe.execution.lightning.sync-on-submit=${KFE_LIGHTNING_SYNC_ON_SUBMIT:true}
# Broadcast on-chain in the submit request so platform peer inbound is exposed immediately.
kfe.execution.onchain.sync-on-submit=${KFE_ONCHAIN_SYNC_ON_SUBMIT:true}
# Prevent a single long cold/scantxoutset job from starving the outbox worker.
spring.task.scheduling.pool.size=${SPRING_TASK_SCHEDULING_POOL_SIZE:8}

custody.provider-name=${CUSTODY_PROVIDER_NAME:BCX}
custody.base-url=${CUSTODY_BASE_URL:}
custody.api-key=${CUSTODY_API_KEY:}
custody.mock-mode=${CUSTODY_MOCK_MODE:false}
btcpay.enabled=${BTCPAY_ENABLED:false}
btcpay.base-url=${BTCPAY_BASE_URL:}
btcpay.api-key=${BTCPAY_API_KEY:}
btcpay.store-id=${BTCPAY_STORE_ID:}

lightning.lnd.rest.enabled=${LIGHTNING_LND_REST_ENABLED:false}
lightning.lnd.base-url=${LIGHTNING_LND_BASE_URL:}
lightning.lnd.macaroon=${LIGHTNING_LND_MACAROON:}
# Trust LND self-signed cert (local/dev). Prefer mounting tls.cert in production.
lightning.lnd.tls.insecure=${LIGHTNING_LND_TLS_INSECURE:false}
lightning.lnd.payment-timeout-seconds=${LIGHTNING_LND_PAYMENT_TIMEOUT_SECONDS:30}
transactions.rails.lightning.invoice-provider=${TRANSACTIONS_LIGHTNING_INVOICE_PROVIDER:auto}
transactions.rails.lightning.payment-provider=${TRANSACTIONS_LIGHTNING_PAYMENT_PROVIDER:auto}

# Binary settlement gate (architecture doc §2)
# lightning risk flags (V_LIQUIDEZ, V_NO_JAMMING, V_CIRCUIT_BREAKER): beta-pass | enforce
kfe.settlement.lightning.risk-gate-mode=${KFE_SETTLEMENT_LIGHTNING_RISK_GATE_MODE:enforce}
# FAIL-CLOSED: proof-of-reserves gate enabled. Blocks settlement if liabilities > assets + buffer.
kfe.settlement.por-gate-enabled=${KFE_SETTLEMENT_POR_GATE_ENABLED:true}
kfe.settlement.allow-simulated-balances=${KFE_SETTLEMENT_ALLOW_SIMULATED_BALANCES:false}
# PoR safety buffer in basis points (5000 = 50%). Prevents operation when ratio < minimum.
kfe.reserves.proof-of-reserves.enabled=${KFE_RESERVES_PROOF_OF_RESERVES_ENABLED:true}
kfe.reserves.proof-of-reserves.safety-buffer-bps=${KFE_RESERVES_PROOF_OF_RESERVES_SAFETY_BUFFER_BPS:5000}
kfe.reserves.proof-of-reserves.minimum-coverage-ratio=${KFE_RESERVES_PROOF_OF_RESERVES_MINIMUM_COVERAGE_RATIO:1.0}
# PROFIT segregation: how SYSTEM_PROFIT is isolated from USERS backing.
# SUBLEDGER (default): profit tracked as ledger entry within USERS, reconciled against assets.
# DEDICATED_BUCKET: separate vault bucket for profit; stronger isolation but needs mesh support.
# PERIODIC_TRANSFER: profit accrued in subledger, moved to dedicated address periodically.
kfe.profit.segregation-mode=${KFE_PROFIT_SEGREGATION_MODE:SUBLEDGER}
kfe.profit.dedicated-bucket-name=${KFE_PROFIT_DEDICATED_BUCKET_NAME:SYSTEM_PROFIT}
# When true, SYSTEM_PROFIT balance is reconciled against actual vault-controlled assets.
kfe.profit.reconcile-with-vault=${KFE_PROFIT_RECONCILE_WITH_VAULT:true}

# Lightning liquidity / circuit breaker (sats). Floor 0 disables circuit breaker.
kfe.lightning.min-outbound-sats=${KFE_LIGHTNING_MIN_OUTBOUND_SATS:0}
kfe.lightning.circuit-breaker-floor-sats=${KFE_LIGHTNING_CIRCUIT_BREAKER_FLOOR_SATS:0}
# Anti-jamming: refuse LN outbound when pending HTLCs >= max (0 disables ceiling).
kfe.lightning.max-pending-htlcs=${KFE_LIGHTNING_MAX_PENDING_HTLCS:48}
# Comma-separated remote pubkeys (hex). Outbound blocked while they hold pending HTLCs.
kfe.lightning.peer-denylist=${KFE_LIGHTNING_PEER_DENYLIST:}
kfe.lightning.jamming.enforce-when-unprobeable=${KFE_LIGHTNING_JAMMING_ENFORCE_WHEN_UNPROBEABLE:false}

# Channel lifecycle (doc §3) — structural ops cost attribution via SYSTEM_PROFIT
kfe.channel.min-open-capital-sats=${KFE_CHANNEL_MIN_OPEN_CAPITAL_SATS:10000000}
kfe.channel.max-onchain-fee-rate-sat-vb=${KFE_CHANNEL_MAX_ONCHAIN_FEE_RATE_SAT_VB:50}
kfe.channel.rebalance-drain-ratio=${KFE_CHANNEL_REBALANCE_DRAIN_RATIO:0.20}
kfe.channel.drain-deterrent-ppm=${KFE_CHANNEL_DRAIN_DETERRENT_PPM:5000}
kfe.channel.break-even-ppm=${KFE_CHANNEL_BREAK_EVEN_PPM:1000}
kfe.channel.anchors-required=${KFE_CHANNEL_ANCHORS_REQUIRED:true}
kfe.channel.require-mpc=${KFE_CHANNEL_REQUIRE_MPC:true}
# When true, OPEN requires ChannelsMeshInjectGateway authorization (mesh CHANNELS capital).
# Default adapter is fail-closed — do not treat LND wallet sats as CHANNELS capital.
kfe.channel.require-channels-mesh-inject=${KFE_CHANNEL_REQUIRE_CHANNELS_MESH_INJECT:false}
kfe.channel.default-time-lock-delta=${KFE_CHANNEL_DEFAULT_TIME_LOCK_DELTA:80}
kfe.channel.drain-monitor.enabled=${KFE_CHANNEL_DRAIN_MONITOR_ENABLED:true}
kfe.channel.drain-monitor.auto-ppm=${KFE_CHANNEL_DRAIN_MONITOR_AUTO_PPM:true}
kfe.channel.drain-monitor.auto-enqueue-rebalance=${KFE_CHANNEL_DRAIN_MONITOR_AUTO_ENQUEUE_REBALANCE:true}
kfe.channel.drain-monitor.default-rebalance-cost-sats=${KFE_CHANNEL_DRAIN_MONITOR_DEFAULT_REBALANCE_COST_SATS:5000}
kfe.channel.drain-monitor.default-expected-gain-sats=${KFE_CHANNEL_DRAIN_MONITOR_DEFAULT_EXPECTED_GAIN_SATS:50000}
kfe.channel.drain-monitor.assumed-current-ppm=${KFE_CHANNEL_DRAIN_MONITOR_ASSUMED_CURRENT_PPM:500}
kfe.channel.drain-monitor.fixed-delay-ms=${KFE_CHANNEL_DRAIN_MONITOR_FIXED_DELAY_MS:120000}
kfe.channel.drain-monitor.initial-delay-ms=${KFE_CHANNEL_DRAIN_MONITOR_INITIAL_DELAY_MS:45000}
kfe.channel.rebalance-worker.enabled=${KFE_CHANNEL_REBALANCE_WORKER_ENABLED:true}
kfe.channel.rebalance-worker.batch-size=${KFE_CHANNEL_REBALANCE_WORKER_BATCH_SIZE:5}
kfe.channel.rebalance-worker.max-fee-sats=${KFE_CHANNEL_REBALANCE_WORKER_MAX_FEE_SATS:5000}
kfe.channel.rebalance-worker.max-amount-sats=${KFE_CHANNEL_REBALANCE_WORKER_MAX_AMOUNT_SATS:500000}
kfe.channel.rebalance-worker.fixed-delay-ms=${KFE_CHANNEL_REBALANCE_WORKER_FIXED_DELAY_MS:90000}
kfe.channel.rebalance-worker.initial-delay-ms=${KFE_CHANNEL_REBALANCE_WORKER_INITIAL_DELAY_MS:60000}
kfe.channel.rebalance-worker.loop-fallback-enabled=${KFE_CHANNEL_REBALANCE_WORKER_LOOP_FALLBACK_ENABLED:true}

# Dead-man capacity controller: usage stress → OPEN/CLOSE intents (async, profit-gated).
kfe.channel.capacity.enabled=${KFE_CHANNEL_CAPACITY_ENABLED:true}
kfe.channel.capacity.auto-open=${KFE_CHANNEL_CAPACITY_AUTO_OPEN:true}
kfe.channel.capacity.auto-close-dead=${KFE_CHANNEL_CAPACITY_AUTO_CLOSE_DEAD:true}
kfe.channel.capacity.signal-window-ms=${KFE_CHANNEL_CAPACITY_SIGNAL_WINDOW_MS:900000}
kfe.channel.capacity.liquidity-reject-threshold=${KFE_CHANNEL_CAPACITY_LIQUIDITY_REJECT_THRESHOLD:5}
# 0 = use min-open-capital-sats
kfe.channel.capacity.open-amount-sats=${KFE_CHANNEL_CAPACITY_OPEN_AMOUNT_SATS:0}
kfe.channel.capacity.estimated-open-fee-sats=${KFE_CHANNEL_CAPACITY_ESTIMATED_OPEN_FEE_SATS:5000}
kfe.channel.capacity.expected-open-gain-sats=${KFE_CHANNEL_CAPACITY_EXPECTED_OPEN_GAIN_SATS:50000}
kfe.channel.capacity.assumed-fee-rate-sat-vb=${KFE_CHANNEL_CAPACITY_ASSUMED_FEE_RATE_SAT_VB:10}
kfe.channel.capacity.inactive-scans-before-close=${KFE_CHANNEL_CAPACITY_INACTIVE_SCANS_BEFORE_CLOSE:3}
kfe.channel.capacity.max-pending-opens=${KFE_CHANNEL_CAPACITY_MAX_PENDING_OPENS:2}
# Comma-separated peer pubkeys the controller may auto-open to (required for auto-open).
kfe.channel.capacity.preferred-peers=${KFE_CHANNEL_CAPACITY_PREFERRED_PEERS:}
kfe.channel.capacity.fixed-delay-ms=${KFE_CHANNEL_CAPACITY_FIXED_DELAY_MS:180000}
kfe.channel.capacity.initial-delay-ms=${KFE_CHANNEL_CAPACITY_INITIAL_DELAY_MS:90000}
kfe.channel.capacity.worker.enabled=${KFE_CHANNEL_CAPACITY_WORKER_ENABLED:true}
kfe.channel.capacity.worker.batch-size=${KFE_CHANNEL_CAPACITY_WORKER_BATCH_SIZE:3}
kfe.channel.capacity.worker.fixed-delay-ms=${KFE_CHANNEL_CAPACITY_WORKER_FIXED_DELAY_MS:120000}
kfe.channel.capacity.worker.initial-delay-ms=${KFE_CHANNEL_CAPACITY_WORKER_INITIAL_DELAY_MS:120000}

# Optional Lightning Loop (loopd) submarine swap fallback
lightning.loop.enabled=${LIGHTNING_LOOP_ENABLED:false}
lightning.loop.base-url=${LIGHTNING_LOOP_BASE_URL:}
lightning.loop.macaroon=${LIGHTNING_LOOP_MACAROON:}
lightning.loop.max-swap-fee-sats=${LIGHTNING_LOOP_MAX_SWAP_FEE_SATS:10000}
lightning.loop.max-miner-fee-sats=${LIGHTNING_LOOP_MAX_MINER_FEE_SATS:5000}
lightning.lnd.invoice-expiry-seconds=${LIGHTNING_LND_INVOICE_EXPIRY_SECONDS:3600}
kfe.payment-request-lightning-monitor.enabled=${KFE_PAYMENT_REQUEST_LIGHTNING_MONITOR_ENABLED:true}
kfe.payment-request-lightning-monitor.batch-size=${KFE_PAYMENT_REQUEST_LIGHTNING_MONITOR_BATCH_SIZE:25}
kfe.payment-request-lightning-monitor.fixed-delay-ms=${KFE_PAYMENT_REQUEST_LIGHTNING_MONITOR_FIXED_DELAY_MS:1000}
kfe.payment-request-lightning-monitor.initial-delay-ms=${KFE_PAYMENT_REQUEST_LIGHTNING_MONITOR_INITIAL_DELAY_MS:25000}
transactions.onchain.max-network-fee-btc=${TRANSACTIONS_ONCHAIN_MAX_NETWORK_FEE_BTC:0.00100000}
transactions.onchain.max-network-fee-percent=${TRANSACTIONS_ONCHAIN_MAX_NETWORK_FEE_PERCENT:0.1000}
# Base virtual size for quote tiers. Real funded PSBTs often exceed a single-input
# 1-output template when the hot wallet has many small UTXOs — pair with safety-margin.
# 400 vB × 1.5 ≈ 600 sats at 1 sat/vB (covers observed ~481 sats funded fees).
kfe.fee-estimate.estimated-vbytes=${KFE_FEE_ESTIMATE_ESTIMATED_VBYTES:400}
# Multiplier applied to rate*vbytes so reserved maxFeeSats covers coin-selection variance.
kfe.fee-estimate.safety-margin=${KFE_FEE_ESTIMATE_SAFETY_MARGIN:1.5}
kfe.fee-estimate.fast-target-blocks=${KFE_FEE_ESTIMATE_FAST_TARGET_BLOCKS:2}
kfe.fee-estimate.standard-target-blocks=${KFE_FEE_ESTIMATE_STANDARD_TARGET_BLOCKS:3}
kfe.fee-estimate.slow-target-blocks=${KFE_FEE_ESTIMATE_SLOW_TARGET_BLOCKS:6}
kfe.fee-estimate.fallback-fast-sat-vbyte=${KFE_FEE_ESTIMATE_FALLBACK_FAST_SAT_VBYTE:25}
kfe.fee-estimate.fallback-standard-sat-vbyte=${KFE_FEE_ESTIMATE_FALLBACK_STANDARD_SAT_VBYTE:12}
kfe.fee-estimate.fallback-slow-sat-vbyte=${KFE_FEE_ESTIMATE_FALLBACK_SLOW_SAT_VBYTE:6}
kfe.fee-estimate.expected-block-seconds=${KFE_FEE_ESTIMATE_EXPECTED_BLOCK_SECONDS:600}
kfe.fee-estimate.quote-ttl-seconds=${KFE_FEE_ESTIMATE_QUOTE_TTL_SECONDS:120}
kfe.execution.max-retry-attempts=${KFE_EXECUTION_MAX_RETRY_ATTEMPTS:8}

# Pricing policy version 1
kfe.pricing.version=1
kfe.pricing.rails.INTERNAL.basis-points=0
kfe.pricing.rails.INTERNAL.enabled=true
kfe.pricing.rails.LIGHTNING-INBOUND.basis-points=0
kfe.pricing.rails.LIGHTNING-INBOUND.enabled=true
kfe.pricing.rails.LIGHTNING-OUTBOUND.basis-points=0
kfe.pricing.rails.LIGHTNING-OUTBOUND.enabled=true
kfe.pricing.rails.ONCHAIN-INBOUND.basis-points=0
kfe.pricing.rails.ONCHAIN-INBOUND.enabled=true
kfe.pricing.rails.ONCHAIN-OUTBOUND.basis-points=90
kfe.pricing.rails.ONCHAIN-OUTBOUND.enabled=true
kfe.pricing.rails.ONCHAIN-OUTBOUND.min-sats=1000
kfe.pricing.rails.ONCHAIN-OUTBOUND.max-sats=50000

quorum.psbt.required-signatures=${QUORUM_PSBT_REQUIRED_SIGNATURES:2}
quorum.psbt.funding-confirmation-target=${QUORUM_PSBT_FUNDING_CONFIRMATION_TARGET:6}
quorum.psbt.signer-urls=${QUORUM_PSBT_SIGNER_URLS:}
quorum.psbt.signer-api-keys=${QUORUM_PSBT_SIGNER_API_KEYS:}
quorum.psbt.signer-ids=${QUORUM_PSBT_SIGNER_IDS:}
quorum.psbt.require-signer-identity=${QUORUM_PSBT_REQUIRE_SIGNER_IDENTITY:true}
# Optional: CSV of "signerId=SHA256Fingerprint,...;signerId2=..." for mTLS certificate binding.
# Empty = skip certificate checks (lab mode). Production MUST set this or use vault mesh.
quorum.psbt.signer-tls-fingerprints=${QUORUM_PSBT_SIGNER_TLS_FINGERPRINTS:}
# Local Bitcoin Core walletprocesspsbt seat (production-capable when Core holds custody keys).
quorum.psbt.local-core-signer-enabled=${QUORUM_PSBT_LOCAL_CORE_SIGNER_ENABLED:false}
quorum.psbt.local-core-signer-id=${QUORUM_PSBT_LOCAL_CORE_SIGNER_ID:bitcoin-core-wallet}

# KFE Webhook delivery (signed payment event notifications)
kfe.webhook.enabled=${KFE_WEBHOOK_ENABLED:false}
kfe.webhook.signing-secret=${KFE_WEBHOOK_SECRET:}
kfe.webhook.max-retries=${KFE_WEBHOOK_MAX_RETRIES:3}
kfe.webhook.timeout-seconds=${KFE_WEBHOOK_TIMEOUT_SECONDS:10}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when_authorized}
management.health.redis.enabled=true
management.health.db.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.region=${REGION:DEV}
management.prometheus.metrics.export.enabled=true

logging.level.root=${LOGGING_LEVEL_ROOT:WARN}
logging.level.com.kerosene.kfe=${LOGGING_LEVEL_COM_KEROSENE_KFE:INFO}
